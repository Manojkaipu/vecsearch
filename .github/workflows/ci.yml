name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  cpp:
    name: C++ ${{ matrix.compiler }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        mode: [release, asan, tsan]
        exclude:
          - { compiler: clang++, mode: tsan }
    steps:
      - uses: actions/checkout@v4
      - name: Lower ASLR entropy for TSan
        if: matrix.mode == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          case "${{ matrix.mode }}" in
            asan) FLAGS="-DCMAKE_BUILD_TYPE=Debug -DVECSEARCH_SANITIZE=ON" ;;
            tsan) FLAGS="-DCMAKE_BUILD_TYPE=RelWithDebInfo -DVECSEARCH_TSAN=ON" ;;
            *)    FLAGS="-DCMAKE_BUILD_TYPE=Release" ;;
          esac
          cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DVECSEARCH_ARCH=x86-64-v3 $FLAGS
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - name: Install
        env: { CMAKE_ARGS: "-DVECSEARCH_ARCH=x86-64-v3" }
        run: pip install . -r requirements-bench.txt
      - run: python -m pytest tests/python -q
      - name: Smoke test
        run: make smoke smoke-dist PY=python
      - uses: actions/upload-artifact@v4
        with: { name: "smoke-results-${{ matrix.python }}", path: results/smoke }

  cuda-build:
    name: CUDA build (no GPU)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update -qq && apt-get install -y -qq cmake g++ python3-pip python3-dev > /dev/null
      - name: Build with CUDA for sm_75 (T4) and sm_80
        env: { CMAKE_ARGS: "-DVECSEARCH_BUILD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75;80 -DVECSEARCH_ARCH=x86-64-v3" }
        run: pip install --break-system-packages . pytest
      - name: Import without a GPU, run tests (GPU tests skip)
        run: |
          python3 -c "import vecsearch as vs; assert vs.GpuBruteForceIndex is not None; assert not vs.cuda_available()"
          python3 -m pytest tests/python -q

  # The OpenCL kernels run on POCL, an open-source OpenCL that executes them on the runner's CPU,
  # so every commit checks the GPU code against the CPU index without needing a GPU.
  opencl:
    name: OpenCL on POCL (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install POCL and the OpenCL headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pocl-opencl-icd ocl-icd-opencl-dev opencl-headers clinfo
          clinfo -l
          clinfo | grep -Ei "device version|sub-group|max work group size|max memory allocation" || true
      - name: C++ tests (GoogleTest)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVECSEARCH_ARCH=x86-64-v3 -DVECSEARCH_BUILD_OPENCL=ON
          cmake --build build -j
          ./build/vecsearch_tests --gtest_filter='*OpenCL*' --gtest_brief=1
          ctest --test-dir build --output-on-failure -E OpenCL -j2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Python tests (pytest)
        env: { CMAKE_ARGS: "-DVECSEARCH_ARCH=x86-64-v3 -DVECSEARCH_BUILD_OPENCL=ON" }
        run: |
          pip install . pytest
          python -c "import vecsearch as vs; print(vs.opencl_devices()); assert vs.opencl_available()"
          python -m pytest tests/python -q

  docker:
    runs-on: ubuntu-24.04
    needs: [cpp, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vecsearch .
